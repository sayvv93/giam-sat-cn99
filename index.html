<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tồn Phiếu & Cảnh Báo Onsite - FPT</title>
    <style>
        :root {
            --fpt-orange: #F15A24;
            --fpt-orange-dark: #d24818;
            --fpt-orange-light: #fff2ed;
            --fpt-blue: #00A99D;
            --fpt-dark: #231F20;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --border-color: #fce8e3;
            --text-color: #333333;
            --danger-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .container {
            max-width: 1650px;
            margin: 0 auto;
        }

        .header-box {
            background: linear-gradient(135deg, var(--fpt-orange), #ff8453);
            color: white;
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(241, 90, 36, 0.25);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .sync-status {
            font-size: 14px;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* TABS NAVIGATION */
        .tabs-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: #e1e8ed;
            color: #555;
            border: none;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--fpt-orange);
            color: white;
            box-shadow: 0 4px 12px rgba(241, 90, 36, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* FILTERS */
        .filters {
            background: var(--card-bg);
            padding: 20px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            border-left: 5px solid var(--fpt-orange);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 700;
            font-size: 12px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            padding: 9px 12px;
            border-radius: 8px;
            border: 2px solid #e1e8ed;
            min-width: 200px;
            font-size: 13px;
            background-color: #fff;
            color: #333;
            font-weight: 500;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--fpt-orange);
            outline: none;
        }

        /* CARDS GRID (CHO TAB CẢNH BÁO) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card-item {
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            overflow: hidden;
            border-top: 6px solid var(--fpt-orange);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(241, 90, 36, 0.15);
        }

        .card-header {
            background: #fff5f2;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title-text {
            font-size: 15px;
            font-weight: 800;
            color: var(--fpt-orange-dark);
            margin: 0;
        }

        .card-badge {
            background: var(--fpt-orange);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .card-body {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            padding-bottom: 6px;
            border-bottom: 1px dashed #eee;
        }

        .stat-row span:last-child {
            color: var(--fpt-dark);
            font-weight: 700;
        }

        .stat-row.urgent span:last-child {
            color: var(--danger-color);
        }

        /* TABLE */
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: var(--fpt-orange);
            font-weight: 600;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .table-responsive {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            vertical-align: middle;
            white-space: nowrap;
        }

        th {
            background-color: var(--fpt-dark);
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: var(--fpt-orange-light);
        }

        tr.row-danger {
            background-color: rgba(231, 76, 60, 0.08);
        }

        .badge-warning {
            background-color: var(--danger-color);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-normal {
            background-color: #2ecc71;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-missing {
            background-color: #95a5a6;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .col-ghichu {
            min-width: 320px;
            max-width: 450px;
            white-space: normal !important;
            word-wrap: break-word;
            line-height: 1.5;
            color: #444;
        }

        select.ket-qua {
            padding: 5px 6px;
            border-radius: 6px;
            border: 2px solid #ddd;
            font-weight: 600;
            font-size: 12px;
            background: #fafafa;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--fpt-orange), #e04b16);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(241, 90, 36, 0.3);
        }

        .btn-submit:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            box-shadow: none;
        }

        td b {
            color: var(--fpt-orange-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <h2>🛠️ Tồn Phiếu & Cảnh Báo Onsite</h2>
            <div id="syncText" class="sync-status">✔ Đã đồng bộ!</div>
        </div>

        <!-- HỆ THỐNG TAB CHUYỂN ĐỔI -->
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('tonTab', this)">📋 Tồn Phiếu Onsite</button>
            <button class="tab-btn" onclick="switchTab('canhBaoTab', this)">📊 Cảnh Báo Theo Khu Vực & Kỹ Thuật</button>
        </div>

        <!-- BỘ LỌC CHUNG CHO CẢ 2 TAB -->
        <div class="filters">
            <div class="filter-group">
                <label for="filterB">📍 Lọc Block:</label>
                <select id="filterB" onchange="applyFilters()">
                    <option value="">-- Tất cả Block --</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterC">⚙️ Lọc Kỹ Thuật:</label>
                <select id="filterC" onchange="applyFilters()">
                    <option value="">-- Tất cả Kỹ Thuật --</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterKV">🌍 Lọc KV:</label>
                <select id="filterKV" onchange="applyFilters()">
                    <option value="">-- Tất cả KV --</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterCUS">👤 Lọc CUS:</label>
                <select id="filterCUS" onchange="applyFilters()">
                    <option value="">-- Tất cả CUS --</option>
                </select>
            </div>
        </div>

        <!-- TAB 1: TỒN PHIẾU -->
        <div id="tonTab" class="tab-content active">
            <div class="table-responsive">
                <div id="loading" class="loading">⏳ Đang kết nối lấy dữ liệu siêu tốc từ hệ thống...</div>
                <table id="dataTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>SHD</th>
                            <th>Thời Gian Tồn</th>
                            <th>Block</th>
                            <th>Kỹ Thuật</th>
                            <th class="col-ghichu">Ghi Chú</th>
                            <th>Kết Quả</th>
                            <th>Thao Tác</th>
                            <th>Tên KH</th>
                            <th>Tập Điểm</th>
                            <th>Số Tiền</th>
                            <th>KV</th>
                            <th>Nội Dung</th>
                            <th>CUS</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: CẢNH BÁO -->
        <div id="canhBaoTab" class="tab-content">
            <div class="cards-grid" id="groupCardsContainer">
                <div id="loadingCards" class="loading">⏳ Đang tải cảnh báo...</div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwZHOvMbeS6Z87Cd77b4Q9HliNmFKkANQQB-x0-28EeoIsOFHA6AwjWwBZ95pnGxoCo/exec";
        let allData = [];

        window.onload = function() {
            loadData();
        };

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        function loadData() {
            let oldScript = document.getElementById('jsonp_data_script');
            if (oldScript) oldScript.remove();

            let script = document.createElement('script');
            script.id = 'jsonp_data_script';
            script.src = `${WEB_APP_URL}?callback=handleData&_=${new Date().getTime()}`;
            document.body.appendChild(script);
        }

        function handleData(data) {
            allData = data.filter(item => {
                let s = String(item.shd || "").trim();
                if (!s || s === "#N/A") return false;
                return true;
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('dataTable').style.display = 'table';
            
            initFilters();
            applyFilters();
        }

        function getPendData(item) {
            if (item.thoiGian) {
                let inputDate = new Date(item.thoiGian);
                if (!isNaN(inputDate.getTime())) {
                    let diffTime = new Date() - inputDate;
                    if (diffTime < 0) diffTime = 0;
                    let days = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                    let hours = Math.floor((diffTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    let minutes = Math.floor((diffTime % (1000 * 60 * 60)) / (1000 * 60));
                    return { totalMs: diffTime, days, hours, minutes, isValid: true };
                }
            }
            return { totalMs: 0, days: 0, hours: 0, minutes: 0, isValid: false };
        }

        function formatPendText(pendData) {
            if (!pendData.isValid) return "Chưa có log TG";
            let textParts = [];
            if (pendData.days > 0) textParts.push(`${pendData.days} ngày`);
            if (pendData.hours > 0) textParts.push(`${pendData.hours} giờ`);
            if (pendData.minutes > 0 || textParts.length === 0) textParts.push(`${pendData.minutes} phút`);
            return "Tồn " + textParts.join(' ');
        }

        function initFilters() {
            let blocks = [...new Set(allData.map(item => item.khuVuc))].filter(b => b && b !== "#N/A").sort();
            let kyThuats = [...new Set(allData.map(item => item.kyThuat))].filter(kt => kt && kt !== "#N/A").sort();
            let kvs = [...new Set(allData.map(item => item.kv))].filter(kv => kv && kv !== "#N/A").sort();
            let cuss = [...new Set(allData.map(item => item.cus))].filter(cus => cus && cus !== "#N/A").sort();
            
            let selectB = document.getElementById('filterB');
            let selectC = document.getElementById('filterC');
            let selectKV = document.getElementById('filterKV');
            let selectCUS = document.getElementById('filterCUS');
            
            if(selectB.options.length <= 1) {
                blocks.forEach(b => selectB.add(new Option(b, b)));
                kyThuats.forEach(kt => selectC.add(new Option(kt, kt)));
                kvs.forEach(kv => selectKV.add(new Option(kv, kv)));
                cuss.forEach(cus => selectCUS.add(new Option(cus, cus)));
            }
        }

        function applyFilters() {
            let selectedBlock = document.getElementById('filterB').value;
            let selectedKT = document.getElementById('filterC').value;
            let selectedKV = document.getElementById('filterKV').value;
            let selectedCUS = document.getElementById('filterCUS').value;

            let filtered = allData.filter(item => {
                let status = String(item.ketQua || "").trim().toLowerCase();
                if (status === "đã thu" || status === "đã gửi hình và định vị lên gr" || status === "tạo checklist") return false;

                let matchB = !selectedBlock || item.khuVuc === selectedBlock;
                let matchC = !selectedKT || item.kyThuat === selectedKT;
                let matchKV = !selectedKV || item.kv === selectedKV;
                let matchCUS = !selectedCUS || item.cus === selectedCUS;
                return matchB && matchC && matchKV && matchCUS;
            });

            filtered.sort((a, b) => getPendData(b).totalMs - getPendData(a).totalMs);

            // Cập nhật dữ liệu cho cả 2 Tab cùng lúc
            renderTable(filtered);
            renderGroupCards(filtered);
        }

        function renderGroupCards(data) {
            let container = document.getElementById('groupCardsContainer');
            container.innerHTML = '';

            let groupMap = {};

            data.forEach(item => {
                let kv = String(item.kv || "Chưa phân KV").trim();
                let kt = String(item.kyThuat || "Chưa phân KT").trim();
                let groupKey = kv + " | " + kt;

                if (!groupMap[groupKey]) {
                    groupMap[groupKey] = { kv: kv, kt: kt, totalTon: 0, urgentTon: 0 };
                }

                groupMap[groupKey].totalTon++;
                let pend = getPendData(item);
                if (pend.days > 3) {
                    groupMap[groupKey].urgentTon++;
                }
            });

            let sortedGroups = Object.values(groupMap).sort((a, b) => b.totalTon - a.totalTon);

            if (sortedGroups.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #777; padding: 40px; font-weight: 600; background: white; border-radius: 12px;">🎉 Tuyệt vời! Không có dữ liệu tồn phù hợp với bộ lọc.</div>`;
                return;
            }

            sortedGroups.forEach(grp => {
                let card = document.createElement('div');
                card.className = 'card-item';
                card.innerHTML = `
                    <div class="card-header">
                        <h3 class="card-title-text">🌍 ${grp.kv}</h3>
                        <span class="card-badge">${grp.totalTon} phiếu</span>
                    </div>
                    <div class="card-body">
                        <div class="stat-row">
                            <span>⚙️ Kỹ thuật phụ trách:</span>
                            <span>${grp.kt}</span>
                        </div>
                        <div class="stat-row">
                            <span>📦 Tổng tồn khu vực:</span>
                            <span>${grp.totalTon} phiếu</span>
                        </div>
                        <div class="stat-row urgent">
                            <span>⚠ Tồn quá hạn (> 3 ngày):</span>
                            <span>${grp.urgentTon} phiếu</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderTable(data) {
            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="13" style="text-align: center; color: #777; padding: 30px; font-weight: 500;">🚫 Không tìm thấy dữ liệu chi tiết tồn!</td></tr>`;
                return;
            }

            data.forEach(item => {
                let pendData = getPendData(item);
                let isDanger = pendData.days > 3; 
                let trClass = isDanger ? "row-danger" : "";
                let pendText = formatPendText(pendData);
                
                let badgeHtml = !pendData.isValid ? `<span class="badge-missing">${pendText}</span>` :
                                isDanger ? `<span class="badge-warning">⚠ ${pendText}</span>` :
                                `<span class="badge-normal">${pendText}</span>`;

                let isCN60 = String(item.kv || "").toUpperCase().includes("CN60");
                let extraOption = isCN60 ? 
                    `<option value="Đã gửi hình và định vị lên GR" ${item.ketQua === "Đã gửi hình và định vị lên GR" ? "selected" : ""}>Đã gửi hình và định vị lên GR</option>` : 
                    `<option value="Tạo Checklist" ${item.ketQua === "Tạo Checklist" ? "selected" : ""}>Tạo Checklist</option>`;

                let tr = document.createElement('tr');
                tr.className = trClass;
                tr.innerHTML = `
                    <td><b>${item.shd || ''}</b></td>
                    <td>${badgeHtml}</td>
                    <td>${item.khuVuc || ''}</td>
                    <td>${item.kyThuat || ''}</td>
                    <td class="col-ghichu">${item.ghiChu || ''}</td>
                    <td>
                        <select class="ket-qua" id="select_${item.row}">
                            <option value="" ${item.ketQua === "" ? "selected" : ""}>-- Chọn --</option>
                            <option value="Đã thu" ${item.ketQua === "Đã thu" ? "selected" : ""}>Đã thu</option>
                            <option value="Chưa thu" ${item.ketQua === "Chưa thu" ? "selected" : ""}>Chưa thu</option>
                            <option value="Hẹn lại" ${item.ketQua === "Hẹn lại" ? "selected" : ""}>Hẹn lại</option>
                            ${extraOption}
                        </select>
                    </td>
                    <td>
                        <button class="btn-submit" id="btn_${item.row}" onclick="submitStatus(${item.row})">Gửi</button>
                    </td>
                    <td>${item.tenKH || ''}</td>
                    <td>${item.tapDiem || ''}</td>
                    <td>${item.soTien || ''}</td>
                    <td>${item.kv || ''}</td>
                    <td>${item.noiDung || ''}</td>
                    <td>${item.cus || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function submitStatus(rowNumber) {
            let selectElement = document.getElementById(`select_${rowNumber}`);
            let btnElement = document.getElementById(`btn_${rowNumber}`);
            let value = selectElement.value;

            btnElement.innerText = "Đang gửi...";
            btnElement.disabled = true;

            let oldUpdateScript = document.getElementById('jsonp_update_script');
            if (oldUpdateScript) oldUpdateScript.remove();

            let updateScript = document.createElement('script');
            updateScript.id = 'jsonp_update_script';
            updateScript.src = `${WEB_APP_URL}?row=${rowNumber}&value=${encodeURIComponent(value)}&callback=handleUpdateComplete&_=${new Date().getTime()}`;
            document.body.appendChild(updateScript);
        }

        function handleUpdateComplete(data) {
            let syncText = document.getElementById('syncText');
            syncText.style.opacity = 1;
            setTimeout(() => { syncText.style.opacity = 0; }, 2500);

            allData = data.filter(item => {
                let s = String(item.shd || "").trim();
                if (!s || s === "#N/A") return false;
                return true;
            });

            applyFilters();
        }
    </script>
</body>
</html>
