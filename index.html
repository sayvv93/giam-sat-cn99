<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tồn Phiếu & Cảnh Báo CN60 - FPT</title>
    <style>
        /*
          Design tokens
          - Nền: be ấm nhạt, tách biệt khỏi trắng thuần của thẻ (card)
          - Màu chính: cam FPT (thương hiệu) — chỉ dùng cho hành động & điểm nhấn
          - Teal: dùng cho trạng thái phụ, tránh lạm dụng cam ở mọi nơi
          - Đỏ: chỉ dành riêng cho cảnh báo quá hạn, không dùng cho việc khác
        */
        :root {
            --fpt-orange: #F15A24;
            --fpt-orange-dark: #C43F13;
            --fpt-orange-tint: #FFF1EA;
            --teal: #0E9C8F;
            --teal-tint: #E9F7F5;
            --ink: #221D1B;
            --ink-soft: #6B615D;
            --ink-faint: #9C918C;
            --bg: #F6F3EF;
            --surface: #FFFFFF;
            --line: #ECE4DD;
            --danger: #D9483A;
            --danger-tint: #FCEBE8;
            --success: #1F9D6E;
            --success-tint: #E7F7EF;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-card: 0 1px 2px rgba(34, 29, 26, 0.04), 0 6px 16px rgba(34, 29, 26, 0.06);
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--ink);
            font-size: 15px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
        }

        a, button, select { font-family: inherit; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 0 40px;
        }

        /* HEADER — sticky, gọn trên điện thoại, có vùng an toàn cho notch */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--fpt-orange);
            color: white;
            padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(241, 90, 36, 0.28);
        }

        .app-header h1 {
            margin: 0;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.1px;
        }

        .sync-status {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.22);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.4s ease;
            white-space: nowrap;
        }
        @media (prefers-reduced-motion: reduce) {
            .sync-status { transition: none; }
        }

        .content-pad { padding: 14px 16px 0; }

        /* SEGMENTED TAB — full width trên di động, chạm dễ hơn nút nhỏ */
        .tabs-nav {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 4px;
            gap: 4px;
            margin-bottom: 14px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            color: var(--ink-soft);
            border: none;
            padding: 10px 8px;
            font-size: 13.5px;
            font-weight: 700;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .tab-btn.active {
            background: var(--fpt-orange);
            color: white;
        }

        .tab-btn:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible {
            outline: 2px solid var(--teal);
            outline-offset: 2px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* STATS STRIP — con số cần biết ngay khi mở app */
        .stats-strip {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat-chip {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 10px 14px;
        }

        .stat-chip .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--ink);
            line-height: 1.1;
        }

        .stat-chip.is-danger .stat-value { color: var(--danger); }

        .stat-chip .stat-label {
            font-size: 11.5px;
            color: var(--ink-soft);
            font-weight: 600;
            margin-top: 2px;
        }

        /* FILTER DRAWER — gấp lại trên điện thoại để nhường chỗ cho danh sách */
        .filter-drawer {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            overflow: hidden;
        }

        .filter-drawer > summary {
            list-style: none;
            cursor: pointer;
            padding: 12px 14px;
            font-weight: 700;
            font-size: 13.5px;
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .filter-drawer > summary::-webkit-details-marker { display: none; }

        .filter-drawer > summary .chevron {
            color: var(--ink-faint);
            transition: transform 0.15s ease;
        }

        .filter-drawer[open] > summary .chevron { transform: rotate(180deg); }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            padding: 2px 14px 14px;
        }

        .filter-field { display: flex; flex-direction: column; gap: 5px; }

        .filter-field label {
            font-size: 12px;
            color: var(--ink-soft);
            font-weight: 600;
        }

        select {
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--line);
            font-size: 15px; /* >=16px hợp lý, tránh Safari tự zoom khi focus */
            background-color: var(--bg);
            color: var(--ink);
            font-weight: 500;
            cursor: pointer;
            min-height: 42px;
        }

        select:focus { border-color: var(--fpt-orange); outline: none; }

        /* TICKET LIST — thay bảng ngang bằng danh sách thẻ, đọc được trên màn hẹp */
        .ticket-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .loading, .empty-state {
            text-align: center;
            padding: 44px 20px;
            font-size: 15px;
            color: var(--ink-soft);
            font-weight: 600;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
        }

        .ticket-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-left: 4px solid var(--teal);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 14px 16px;
        }

        .ticket-card.is-overdue {
            border-left-color: var(--danger);
            background: linear-gradient(180deg, var(--danger-tint) 0%, var(--surface) 90px);
        }

        .ticket-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .ticket-id {
            font-size: 15px;
            font-weight: 800;
            color: var(--fpt-orange-dark);
        }

        .badge-warning, .badge-normal, .badge-missing {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 700;
            white-space: nowrap;
        }
        .badge-warning { background: var(--danger-tint); color: var(--danger); }
        .badge-normal { background: var(--success-tint); color: var(--success); }
        .badge-missing { background: #F1EEEB; color: var(--ink-faint); }

        .ticket-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .chip {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-soft);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 4px 10px;
        }

        .ticket-note {
            margin: 10px 0 0;
            font-size: 13.5px;
            color: var(--ink);
            line-height: 1.5;
        }

        .ticket-note.is-secondary { color: var(--ink-soft); }

        .ticket-fields {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 12px 0 0;
            padding-top: 10px;
            border-top: 1px dashed var(--line);
        }

        .field label {
            display: block;
            font-size: 11px;
            color: var(--ink-faint);
            font-weight: 600;
            margin-bottom: 2px;
        }

        .field span {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--ink);
        }

        .ticket-action {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-submit {
            background: var(--fpt-orange);
            color: white;
            border: none;
            padding: 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14.5px;
            font-weight: 700;
            min-height: 44px; /* mục tiêu chạm tối thiểu trên di động */
        }

        .btn-submit:disabled {
            background: #D8D2CD;
            cursor: not-allowed;
        }

        /* CẢNH BÁO TAB */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .card-item {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }

        .card-header {
            background: var(--fpt-orange-tint);
            padding: 13px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .card-title-text {
            font-size: 14.5px;
            font-weight: 800;
            color: var(--fpt-orange-dark);
            margin: 0;
        }

        .card-badge {
            background: var(--fpt-orange);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 700;
            white-space: nowrap;
        }

        .card-body {
            padding: 13px 16px;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-soft);
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--line);
        }

        .stat-row:last-child { border-bottom: none; padding-bottom: 0; }

        .stat-row span:last-child {
            color: var(--ink);
            font-weight: 700;
        }

        .stat-row.urgent span:last-child { color: var(--danger); }

        /* ≥ 720px: tablet/desktop — dùng không gian rộng hơn, filter luôn mở */
        @media (min-width: 720px) {
            .content-pad { padding: 18px 24px 0; }
            .app-header { padding: 18px 24px; }
            .app-header h1 { font-size: 20px; }

            .tabs-nav { display: inline-flex; width: auto; }
            .tab-btn { flex: none; padding: 10px 22px; }

            .stats-strip { max-width: 480px; }

            .filter-drawer > summary { display: none; }
            .filter-grid {
                grid-template-columns: repeat(4, minmax(160px, 1fr));
                padding: 14px;
            }

            .ticket-list { grid-template-columns: repeat(2, 1fr); }
            .cards-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

            .ticket-fields { grid-template-columns: repeat(3, 1fr); }
            .ticket-action { flex-direction: row; align-items: stretch; }
            .ticket-action select { flex: 1; }
            .ticket-action .btn-submit { flex: 0 0 110px; }
        }

        @media (min-width: 1100px) {
            .ticket-list { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1>🛠️ Tồn Phiếu & Cảnh Báo CN60</h1>
        <div id="syncText" class="sync-status">✔ Đã đồng bộ</div>
    </header>

    <div class="container">
        <div class="content-pad">

            <div class="tabs-nav">
                <button class="tab-btn active" onclick="switchTab('tonTab', this)">📋 Tồn Phiếu CN60</button>
                <button class="tab-btn" onclick="switchTab('canhBaoTab', this)">📊 Cảnh Báo Khu Vực</button>
            </div>

            <div class="stats-strip">
                <div class="stat-chip">
                    <div class="stat-value" id="statTotal">–</div>
                    <div class="stat-label">Phiếu đang tồn</div>
                </div>
                <div class="stat-chip is-danger">
                    <div class="stat-value" id="statOverdue">–</div>
                    <div class="stat-label">Quá hạn trên 3 ngày</div>
                </div>
            </div>

            <details class="filter-drawer" open>
                <summary>
                    <span>🔍 Bộ lọc</span>
                    <span class="chevron">▾</span>
                </summary>
                <div class="filter-grid">
                    <div class="filter-field">
                        <label for="filterB">📍 Block</label>
                        <select id="filterB" onchange="applyFilters()">
                            <option value="">Tất cả Block</option>
                        </select>
                    </div>
                    <div class="filter-field">
                        <label for="filterC">⚙️ Kỹ thuật</label>
                        <select id="filterC" onchange="applyFilters()">
                            <option value="">Tất cả kỹ thuật</option>
                        </select>
                    </div>
                    <div class="filter-field">
                        <label for="filterKV">🌍 KV</label>
                        <select id="filterKV" onchange="applyFilters()">
                            <option value="">Tất cả KV</option>
                        </select>
                    </div>
                    <div class="filter-field">
                        <label for="filterCUS">👤 CUS</label>
                        <select id="filterCUS" onchange="applyFilters()">
                            <option value="">Tất cả CUS</option>
                        </select>
                    </div>
                </div>
            </details>

            <!-- TAB 1: TỒN PHIẾU -->
            <div id="tonTab" class="tab-content active">
                <div id="loading" class="loading">⏳ Đang tải dữ liệu...</div>
                <div id="ticketList" class="ticket-list" style="display:none;"></div>
            </div>

            <!-- TAB 2: CẢNH BÁO -->
            <div id="canhBaoTab" class="tab-content">
                <div class="cards-grid" id="groupCardsContainer">
                    <div id="loadingCards" class="loading">⏳ Đang tải cảnh báo...</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwZHOvMbeS6Z87Cd77b4Q9HliNmFKkANQQB-x0-28EeoIsOFHA6AwjWwBZ95pnGxoCo/exec";
        let allData = [];

        // Cache DOM dùng nhiều lần
        const dom = {};

        window.onload = function () {
            dom.loading = document.getElementById('loading');
            dom.ticketList = document.getElementById('ticketList');
            dom.groupCardsContainer = document.getElementById('groupCardsContainer');
            dom.syncText = document.getElementById('syncText');
            dom.filterB = document.getElementById('filterB');
            dom.filterC = document.getElementById('filterC');
            dom.filterKV = document.getElementById('filterKV');
            dom.filterCUS = document.getElementById('filterCUS');
            dom.statTotal = document.getElementById('statTotal');
            dom.statOverdue = document.getElementById('statOverdue');

            // 1 listener duy nhất cho cả danh sách thay vì gắn onclick từng nút "Gửi"
            dom.ticketList.addEventListener('click', function (e) {
                let btn = e.target.closest('.btn-submit');
                if (btn) submitStatus(Number(btn.dataset.row));
            });

            loadData();
        };

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        function loadData() {
            let oldScript = document.getElementById('jsonp_data_script');
            if (oldScript) oldScript.remove();

            let script = document.createElement('script');
            script.id = 'jsonp_data_script';
            script.src = `${WEB_APP_URL}?callback=handleData&_=${Date.now()}`;
            document.body.appendChild(script);
        }

        function handleData(data) {
            allData = data.filter(item => {
                let s = String(item.shd || "").trim();
                return s && s !== "#N/A";
            });

            dom.loading.style.display = 'none';
            dom.ticketList.style.display = 'grid';

            initFilters();
            applyFilters();
        }

        function getPendData(item) {
            if (item.thoiGian) {
                let inputDate = new Date(item.thoiGian);
                if (!isNaN(inputDate.getTime())) {
                    let diffTime = Math.max(0, Date.now() - inputDate);
                    let days = Math.floor(diffTime / 86400000);
                    let hours = Math.floor((diffTime % 86400000) / 3600000);
                    let minutes = Math.floor((diffTime % 3600000) / 60000);
                    return { totalMs: diffTime, days, hours, minutes, isValid: true };
                }
            }
            return { totalMs: 0, days: 0, hours: 0, minutes: 0, isValid: false };
        }

        function formatPendText(pendData) {
            if (!pendData.isValid) return "Chưa có log TG";
            let textParts = [];
            if (pendData.days > 0) textParts.push(`${pendData.days} ngày`);
            if (pendData.hours > 0) textParts.push(`${pendData.hours} giờ`);
            if (pendData.minutes > 0 || textParts.length === 0) textParts.push(`${pendData.minutes} phút`);
            return "Tồn " + textParts.join(' ');
        }

        // Escape dữ liệu chèn vào innerHTML (ghi chú, tên KH...) để tránh vỡ layout khi có ký tự < > &
        function escapeHtml(value) {
            let str = value === null || value === undefined ? '' : String(value);
            return str.replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function initFilters() {
            let blocks = [...new Set(allData.map(item => item.khuVuc))].filter(b => b && b !== "#N/A").sort();
            let kyThuats = [...new Set(allData.map(item => item.kyThuat))].filter(kt => kt && kt !== "#N/A").sort();
            let kvs = [...new Set(allData.map(item => item.kv))].filter(kv => kv && kv !== "#N/A").sort();
            let cuss = [...new Set(allData.map(item => item.cus))].filter(cus => cus && cus !== "#N/A").sort();

            if (dom.filterB.options.length <= 1) {
                blocks.forEach(b => dom.filterB.add(new Option(b, b)));
                kyThuats.forEach(kt => dom.filterC.add(new Option(kt, kt)));
                kvs.forEach(kv => dom.filterKV.add(new Option(kv, kv)));
                cuss.forEach(cus => dom.filterCUS.add(new Option(cus, cus)));
            }
        }

        function applyFilters() {
            let selectedBlock = dom.filterB.value;
            let selectedKT = dom.filterC.value;
            let selectedKV = dom.filterKV.value;
            let selectedCUS = dom.filterCUS.value;

            let filtered = allData.filter(item => {
                let status = String(item.ketQua || "").trim().toLowerCase();
                if (status === "đã thu" || status === "đã gửi hình và định vị lên gr" || status === "tạo checklist") return false;

                return (!selectedBlock || item.khuVuc === selectedBlock)
                    && (!selectedKT || item.kyThuat === selectedKT)
                    && (!selectedKV || item.kv === selectedKV)
                    && (!selectedCUS || item.cus === selectedCUS);
            });

            filtered.sort((a, b) => getPendData(b).totalMs - getPendData(a).totalMs);

            updateStats(filtered);
            renderTickets(filtered);
            renderGroupCards(filtered);
        }

        function updateStats(data) {
            let overdue = data.reduce((n, item) => n + (getPendData(item).days > 3 ? 1 : 0), 0);
            dom.statTotal.textContent = data.length;
            dom.statOverdue.textContent = overdue;
        }

        function renderGroupCards(data) {
            let groupMap = {};

            data.forEach(item => {
                let kv = String(item.kv || "Chưa phân KV").trim();
                let kt = String(item.kyThuat || "Chưa phân KT").trim();
                let groupKey = kv + " | " + kt;

                if (!groupMap[groupKey]) {
                    groupMap[groupKey] = { kv: kv, kt: kt, totalTon: 0, urgentTon: 0 };
                }

                groupMap[groupKey].totalTon++;
                if (getPendData(item).days > 3) groupMap[groupKey].urgentTon++;
            });

            let sortedGroups = Object.values(groupMap).sort((a, b) => b.totalTon - a.totalTon);

            if (sortedGroups.length === 0) {
                dom.groupCardsContainer.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">🎉 Không có dữ liệu tồn phù hợp với bộ lọc.</div>`;
                return;
            }

            let html = sortedGroups.map(grp => `
                <div class="card-item">
                    <div class="card-header">
                        <h3 class="card-title-text">🌍 ${escapeHtml(grp.kv)}</h3>
                        <span class="card-badge">${grp.totalTon} phiếu</span>
                    </div>
                    <div class="card-body">
                        <div class="stat-row">
                            <span>⚙️ Kỹ thuật phụ trách</span>
                            <span>${escapeHtml(grp.kt)}</span>
                        </div>
                        <div class="stat-row">
                            <span>📦 Tổng tồn khu vực</span>
                            <span>${grp.totalTon} phiếu</span>
                        </div>
                        <div class="stat-row urgent">
                            <span>⚠ Quá hạn trên 3 ngày</span>
                            <span>${grp.urgentTon} phiếu</span>
                        </div>
                    </div>
                </div>`).join('');

            dom.groupCardsContainer.innerHTML = html;
        }

        function renderTickets(data) {
            if (data.length === 0) {
                dom.ticketList.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">🚫 Không tìm thấy phiếu nào khớp bộ lọc.</div>`;
                return;
            }

            let html = data.map(item => {
                let pendData = getPendData(item);
                let isDanger = pendData.days > 3;
                let pendText = formatPendText(pendData);

                let badgeHtml = !pendData.isValid ? `<span class="badge-missing">${pendText}</span>` :
                                isDanger ? `<span class="badge-warning">⚠ ${pendText}</span>` :
                                `<span class="badge-normal">${pendText}</span>`;

                let isCN60 = String(item.kv || "").toUpperCase().includes("CN60");
                let extraOption = isCN60 ?
                    `<option value="Đã gửi hình và định vị lên GR" ${item.ketQua === "Đã gửi hình và định vị lên GR" ? "selected" : ""}>Đã gửi hình và định vị lên GR</option>` :
                    `<option value="Tạo Checklist" ${item.ketQua === "Tạo Checklist" ? "selected" : ""}>Tạo Checklist</option>`;

                return `
                    <div class="ticket-card ${isDanger ? 'is-overdue' : ''}">
                        <div class="ticket-top">
                            <span class="ticket-id">${escapeHtml(item.shd)}</span>
                            ${badgeHtml}
                        </div>
                        <div class="ticket-chips">
                            <span class="chip">📍 ${escapeHtml(item.khuVuc)}</span>
                            <span class="chip">⚙️ ${escapeHtml(item.kyThuat)}</span>
                            <span class="chip">🌍 ${escapeHtml(item.kv)}</span>
                            ${item.cus ? `<span class="chip">👤 ${escapeHtml(item.cus)}</span>` : ''}
                        </div>
                        ${item.ghiChu ? `<p class="ticket-note">${escapeHtml(item.ghiChu)}</p>` : ''}
                        ${item.noiDung ? `<p class="ticket-note is-secondary">${escapeHtml(item.noiDung)}</p>` : ''}
                        <div class="ticket-fields">
                            <div class="field"><label>Khách hàng</label><span>${escapeHtml(item.tenKH)}</span></div>
                            <div class="field"><label>Tập điểm</label><span>${escapeHtml(item.tapDiem)}</span></div>
                            <div class="field"><label>Số tiền</label><span>${escapeHtml(item.soTien)}</span></div>
                        </div>
                        <div class="ticket-action">
                            <select class="ket-qua" id="select_${item.row}">
                                <option value="" ${item.ketQua === "" ? "selected" : ""}>-- Chọn kết quả --</option>
                                <option value="Đã thu" ${item.ketQua === "Đã thu" ? "selected" : ""}>Đã thu</option>
                                <option value="Chưa thu" ${item.ketQua === "Chưa thu" ? "selected" : ""}>Chưa thu</option>
                                <option value="Hẹn lại" ${item.ketQua === "Hẹn lại" ? "selected" : ""}>Hẹn lại</option>
                                ${extraOption}
                            </select>
                            <button class="btn-submit" id="btn_${item.row}" data-row="${item.row}">Gửi</button>
                        </div>
                    </div>`;
            }).join('');

            dom.ticketList.innerHTML = html;
        }

        function submitStatus(rowNumber) {
            let selectElement = document.getElementById(`select_${rowNumber}`);
            let btnElement = document.getElementById(`btn_${rowNumber}`);
            let value = selectElement.value;

            btnElement.innerText = "Đang gửi...";
            btnElement.disabled = true;

            let oldUpdateScript = document.getElementById('jsonp_update_script');
            if (oldUpdateScript) oldUpdateScript.remove();

            let updateScript = document.createElement('script');
            updateScript.id = 'jsonp_update_script';
            updateScript.src = `${WEB_APP_URL}?row=${rowNumber}&value=${encodeURIComponent(value)}&callback=handleUpdateComplete&_=${Date.now()}`;
            document.body.appendChild(updateScript);
        }

        function handleUpdateComplete(data) {
            dom.syncText.style.opacity = 1;
            setTimeout(() => { dom.syncText.style.opacity = 0; }, 2500);

            allData = data.filter(item => {
                let s = String(item.shd || "").trim();
                return s && s !== "#N/A";
            });

            applyFilters();
        }
    </script>
</body>
</html>
